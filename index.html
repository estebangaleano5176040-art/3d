<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D Model Viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      overflow: hidden;
      background-color: #1a1a1a;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    // Paste your Cesium ion Default Access Token here
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6InJfWVZCTUFCZXMxVWJ2VHciLCJqdGkiOiI1ZTJhNGJiOS1lODMxLTQ4MGItYmEwNS03Yzk2MGFlMDA1ODEiLCJpZCI6NDc1NjU3LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODgwMjkyNzF9.V2xyUzJro_9DWIOxDcAFU9e_tREv1vlEc4jjxNJDmc8';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      globe: false,
      skyAtmosphere: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      infoBox: false,
      sceneModePicker: false,
      selectionIndicator: false,
      timeline: false,
      navigationHelpButton: false,
      animation: false
    });

    Cesium.Cesium3DTileset.fromIonAssetId(5169369)
      .then(tileset => {
        viewer.scene.primitives.add(tileset);
        
        // Fix for Agisoft Metashape's oversized bounding boxes
        const rootTile = tileset.root;
        const boundingSphere = rootTile.contentBoundingVolume ? rootTile.contentBoundingVolume.boundingSphere : rootTile.boundingVolume.boundingSphere;
        const offset = new Cesium.HeadingPitchRange(0, -0.5, boundingSphere.radius * 1.5);
        viewer.camera.flyToBoundingSphere(boundingSphere, { duration: 0, offset: offset });
      })
      .catch(error => {
        console.error('Error loading tileset:', error);
      });
  </script>
</body>
</html>
